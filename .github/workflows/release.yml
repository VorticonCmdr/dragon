name: Build & Release

# Every push to main builds and tests the extension. Every tag `v<version>`
# also attaches a Chrome Web Store ready ZIP to a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Read and check version
        id: meta
        run: |
          MANIFEST=$(node -p "require('./public/manifest.json').version")
          PACKAGE=$(node -p "require('./package.json').version")
          if [ "$MANIFEST" != "$PACKAGE" ]; then
            echo "::error::manifest.json ($MANIFEST) and package.json ($PACKAGE) versions differ"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$MANIFEST" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version v$MANIFEST"
            exit 1
          fi
          echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "zip=blue-dragon-$MANIFEST.zip" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npm run build

      # The Chrome Web Store expects manifest.json at the root of the ZIP,
      # so zip the contents of dist/, not the folder itself.
      - name: Zip for the Chrome Web Store
        run: |
          cd dist
          zip -r -X "../${{ steps.meta.outputs.zip }}" . -x '*.DS_Store' '*.map'
          cd ..
          unzip -Z1 "${{ steps.meta.outputs.zip }}" | grep -qx 'manifest.json' \
            || { echo "::error::manifest.json is not at the ZIP root"; exit 1; }
          unzip -l "${{ steps.meta.outputs.zip }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blue-dragon-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.zip }}
          retention-days: 30

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Blue Dragon ${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.zip }}
          generate_release_notes: true
